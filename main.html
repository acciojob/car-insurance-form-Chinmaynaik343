
<!DOCTYPE html>
<html>
<head>
    <title>Car Insurance Registration</title>
</head>
<body>

    <h1>Car Insurance Registration Form</h1>

    <form method="post">

        <label for="name">Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label for="gender_m">Male</label>
        <input type="radio" id="gender_m" name="gender" value="Male" required>

        <label for="gender_f">Female</label>
        <input type="radio" id="gender_f" name="gender" value="Female" required>
        <br><br>

        <label for="cars">Car Brands:</label>
        <select id="cars">
            <option value="">Select a car brand</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Mercedez">Mercedez</option>
        </select>
        <br><br>

        <label for="carage">Car Age:</label>
        <input type="number" id="carage" required>
        <br><br>

        <label for="dop">Date of Purchase:</label>
        <input type="date" id="dop" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" required>
        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
